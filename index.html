<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone - Header</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar Section -->
    <header class="navbar">
        <!-- Logo -->
        <div class="logo-container">
            <a href="#">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/bc/Myntra_Logo.png" alt="Myntra Logo" class="logo">
            </a>
        </div>

        <!-- Navigation Links -->
        <nav class="nav-links">
            <a href="#">MEN</a>
            <a href="#">WOMEN</a>
            <a href="#">KIDS</a>
            <a href="#">HOME & LIVING</a>
            <a href="#">BEAUTY</a>
            <a href="#">STUDIO <sup class="new-tag">NEW</sup></a>
        </nav>

        <!-- Search Bar -->
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Search for products, brands and more">
        </div>

        <!-- User Actions (Profile, Wishlist, Bag) -->
        <div class="nav-actions">
            <a href="#" class="action-item">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </a>
            <a href="#" class="action-item">
                <i class="fa-regular fa-heart"></i>
                <span>Wishlist</span>
            </a>
            <a href="#" class="action-item">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Bag</span>
            </a>
        </div>
    </header>

</body>
</html>
